"indefinite"/><text x="112" y="184" fill="#e6edf3">The evaluation found a 23% calibration gap on low-resource languages, which fed into a joint OpenAI</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8690;0.8737;0.9844;0.9938;1.0000" dur="32s" repeatCount="indefinite"/><text x="112" y="208" fill="#e6edf3">collaboration on clinical LLM deployment. [1]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8784;0.8831;0.9844;0.9938;1.0000" dur="32s" repeatCount="indefinite"/><text x="28" y="232" fill="#58a6ff" font-weight="700">sources</text><text x="112" y="232" fill="#58a6ff">[1] AI Research Engineer · CGMHE (Mar 2026 – now)</text></g></g>
