keyTimes="0.0000;0.3524;0.3571;0.4844;0.4938;1.0000" dur="32s" repeatCount="indefinite"/><text x="112" y="184" fill="#e6edf3">He shipped an LLM agent pipeline (LangChain, OpenAI API) that automates counselor competency scoring across 26K+</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3618;0.3665;0.4844;0.4938;1.0000" dur="32s" repeatCount="indefinite"/><text x="112" y="208" fill="#e6edf3">multilingual clinical transcripts in 25 countries. [1]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3712;0.3758;0.4844;0.4938;1.0000" dur="32s" repeatCount="indefinite"/><text x="28" y="232" fill="#58a6ff" font-weight="700">sources</text><text x="112" y="232" fill="#58a6ff">[1] AI Research Engineer · CGMHE (Mar 2026 – now)</text></g></g>
