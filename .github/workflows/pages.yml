name: Deploy live profile

on:
  push:
    branches: [main]
    paths: ["site/**", "game/corpus.json", "game/rounds.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page reads live game state from raw.githubusercontent.com and falls back to these copies.
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp game/corpus.json game/rounds.json game/state.json game/scores.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
